name: OpenNES Play AAB Validation (Unsigned)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      # Run the expensive unsigned Play check only when bundle packaging,
      # production build variants or the release inspectors change.
      - .github/workflows/play-aab-validation.yml
      - lemuroid-app/build.gradle.kts
      - settings.gradle.kts
      - scripts/inspect-aab.py
      - scripts/tests/test_inspect_aab.py

# Separate from the rolling debug APK. This run is deliberately non-publishing.
concurrency:
  group: opennes-aab-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-aab:
    name: Validate unsigned NES-only Android App Bundle
    runs-on: ubuntu-latest
    env:
      # Deliberately no release keystore/password/alias environment variables.
      # Uploading unsigned output to Google Play is not possible.
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - name: Check out source and pinned emulator cores
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate inspection and release guards
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Check Kotlin formatting
        run: |
          chmod +x gradlew
          ./gradlew ktlintCheck --stacktrace

      - name: Show Kotlin formatting violations
        if: failure()
        run: |
          find . -type f -path '*/build/reports/ktlint/*/*.txt' -print -exec sed -n '1,120p' {} \;

      - name: Prepare pinned native emulation bridge
        run: python3 scripts/prepare-libretrodroid-bridge.py

      - name: Run JVM regression suite
        run: ./gradlew :lemuroid-touchinput:testDebugUnitTest :lemuroid-app:testFreeBundleDebugUnitTest --stacktrace

      - name: Keep NES-only metadata
        run: python3 scripts/trim-libretro-db.py --in-place lemuroid-metadata-libretro-db/src/main/assets/libretro-db.sqlite

      - name: Assemble unsigned production-ID AAB
        run: ./gradlew :lemuroid-app:bundleFreeBundleRelease --stacktrace

      - name: Inspect FCEUmm-only AAB and 16 KiB arm64 ELF page alignment
        run: |
          set -euo pipefail
          mkdir -p dist
          AAB="$(find lemuroid-app/build/outputs/bundle/freeBundleRelease -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$AAB"
          cp "$AAB" dist/OpenNES-UNSIGNED-Play-validation.aab
          python3 scripts/inspect-aab.py --require-16k dist/OpenNES-UNSIGNED-Play-validation.aab
          (cd dist && sha256sum OpenNES-UNSIGNED-Play-validation.aab > OpenNES-UNSIGNED-Play-validation.aab.sha256)
          (cd dist && sha256sum -c OpenNES-UNSIGNED-Play-validation.aab.sha256)

      - name: Upload test artifact (not a Play submission)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opennes-unsigned-play-validation
          path: |
            dist/OpenNES-UNSIGNED-Play-validation.aab
            dist/OpenNES-UNSIGNED-Play-validation.aab.sha256
          if-no-files-found: error
          retention-days: 7
