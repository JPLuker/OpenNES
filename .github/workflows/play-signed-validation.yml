name: OpenNES Signed Play Bundle Validation (Manual)

on:
  workflow_dispatch:

# A signed AAB is generated only through a deliberate, protected run.
# This workflow never uploads to Google Play or publishes a GitHub release.
concurrency:
  group: opennes-protected-play-signing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-signed:
    name: Verify protected production signing and Play AAB
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production-signing
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - name: Check out source and pinned emulator cores
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify release guard tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Require a private signing key and pinned upload certificate
        env:
          KEY_B64: ${{ secrets.OPENNES_RELEASE_KEYSTORE_BASE64 }}
          KEY_PASS: ${{ secrets.OPENNES_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OPENNES_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.OPENNES_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for value in KEY_B64 KEY_PASS KEY_ALIAS EXPECTED_CERT; do
            if [[ -z "${!value}" ]]; then
              echo "::error::Protected release-signing configuration is incomplete."
              exit 1
            fi
          done
          if [[ ! "$EXPECTED_CERT" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::A pinned 64-character SHA-256 upload certificate fingerprint is required."
            exit 1
          fi
          umask 077
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/opennes-play-upload.jks"
          test -s "$RUNNER_TEMP/opennes-play-upload.jks"
          ACTUAL_CERT="$(
            keytool -exportcert -rfc -keystore "$RUNNER_TEMP/opennes-play-upload.jks" \
              -storepass "$KEY_PASS" -alias "$KEY_ALIAS" |
              openssl x509 -noout -fingerprint -sha256 |
              sed 's/.*=//' | tr -d ':' | tr '[:upper:]' '[:lower:]'
          )"
          if [[ "$ACTUAL_CERT" != "${EXPECTED_CERT,,}" ]]; then
            echo "::error::Upload key certificate does not match the pinned fingerprint."
            exit 1
          fi
          echo "Protected signing certificate matched its separately configured fingerprint."

      - name: Check Kotlin source and prepare pinned native bridge
        run: |
          chmod +x gradlew
          ./gradlew ktlintCheck --stacktrace
          python3 scripts/prepare-libretrodroid-bridge.py
          ./gradlew :lemuroid-touchinput:testDebugUnitTest :lemuroid-app:testFreeBundleDebugUnitTest --stacktrace

      - name: Build verified signed production-ID AAB
        env:
          OPENNES_RELEASE_KEYSTORE: ${{ runner.temp }}/opennes-play-upload.jks
          OPENNES_RELEASE_STORE_PASSWORD: ${{ secrets.OPENNES_RELEASE_STORE_PASSWORD }}
          OPENNES_RELEASE_KEY_ALIAS: ${{ secrets.OPENNES_RELEASE_KEY_ALIAS }}
          OPENNES_RELEASE_KEY_PASSWORD: ${{ secrets.OPENNES_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$OPENNES_RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::Missing protected release key password."
            exit 1
          fi
          python3 scripts/trim-libretro-db.py --in-place lemuroid-metadata-libretro-db/src/main/assets/libretro-db.sqlite
          ./gradlew :lemuroid-app:bundleFreeBundleRelease --stacktrace
          mkdir -p dist
          AAB="$(find lemuroid-app/build/outputs/bundle/freeBundleRelease -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$AAB"
          cp "$AAB" dist/OpenNES-Play-SIGNED-validation.aab
          python3 scripts/inspect-aab.py --require-16k dist/OpenNES-Play-SIGNED-validation.aab
          jarsigner -verify -verbose dist/OpenNES-Play-SIGNED-validation.aab > "$RUNNER_TEMP/signature-check.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/signature-check.txt"
          (cd dist && sha256sum OpenNES-Play-SIGNED-validation.aab > OpenNES-Play-SIGNED-validation.aab.sha256)
          (cd dist && sha256sum -c OpenNES-Play-SIGNED-validation.aab.sha256)
          echo "Signed Play package validated. No Play upload or public release took place."

      - name: Upload short-lived signed validation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opennes-protected-signed-play-validation
          path: |
            dist/OpenNES-Play-SIGNED-validation.aab
            dist/OpenNES-Play-SIGNED-validation.aab.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/opennes-play-upload.jks"
