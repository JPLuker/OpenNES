name: Android foreground-service permission regression

on:
  push:
    paths:
      - '**/AndroidManifest.xml'
      - 'scripts/check_foreground_service_permissions.py'
      - 'scripts/tests/test_foreground_service_permissions.py'
      - '.github/workflows/foreground-service-permissions.yml'
  pull_request:
    paths:
      - '**/AndroidManifest.xml'
      - 'scripts/check_foreground_service_permissions.py'
      - 'scripts/tests/test_foreground_service_permissions.py'
      - '.github/workflows/foreground-service-permissions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run permission validator regression tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_foreground_service_permissions.py' -v
      - name: Validate foreground service declarations in Android manifests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' manifest; do
            echo "Checking $manifest"
            python3 scripts/check_foreground_service_permissions.py "$manifest"
          done < <(find . -name AndroidManifest.xml -type f -not -path './.git/*' -print0)
