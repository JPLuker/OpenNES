name: OpenNES Latest Test APK

on:
  push:
    branches: [master]
  workflow_dispatch:

# Only the latest master commit can publish the single test APK.
concurrency:
  group: opennes-development-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-apk:
    name: Verify and publish OpenNES-debug.apk
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # GitHub Actions numbers increase with each workflow run. The checked
      # development APK receives versionCode 100000 + this value.
      OPENNES_DEV_RUN_NUMBER: ${{ github.run_number }}

    steps:
      - name: Check out source and emulator cores
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify APK inspection and release safety rules
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      # Run formatting before modifying and compiling the pinned native
      # emulator bridge: import/spacing errors should fail as cheaply as possible.
      - name: Check Kotlin source formatting
        run: |
          chmod +x gradlew
          ./gradlew ktlintCheck --stacktrace

      - name: Show Kotlin formatting violations
        if: failure()
        run: |
          find . -type f -path '*/build/reports/ktlint/*/*.txt' -print -exec sed -n '1,120p' {} \;

      - name: Prepare pinned native emulation bridge
        run: |
          python3 scripts/prepare-libretrodroid-bridge.py

      - name: Run offline JVM regression tests
        run: |
          ./gradlew :lemuroid-touchinput:testDebugUnitTest :lemuroid-app:testFreeBundleDebugUnitTest --stacktrace

      - name: Retain only NES metadata in the build
        run: |
          python3 scripts/trim-libretro-db.py --in-place lemuroid-metadata-libretro-db/src/main/assets/libretro-db.sqlite

      - name: Assemble installable debug APK
        run: |
          chmod +x gradlew
          ./gradlew :lemuroid-app:assembleFreeBundleDebug --stacktrace

      - name: Stage and inspect NES-only APK
        run: |
          mkdir -p dist
          APK="$(find lemuroid-app/build/outputs/apk/freeBundle/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" dist/OpenNES-debug.apk
          python3 scripts/inspect-apk.py --nes-only --native-bridge dist/OpenNES-debug.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt -print | sort -V | tail -1)"
          test -x "$AAPT"
          set -o pipefail
          "$AAPT" dump badging dist/OpenNES-debug.apk |
            python3 scripts/verify-apk-identity.py --version-file VERSION --run-number "$OPENNES_DEV_RUN_NUMBER"
          (cd dist && sha256sum OpenNES-debug.apk > OpenNES-debug.apk.sha256)

      - name: Publish rolling OpenNES development release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -s dist/OpenNES-debug.apk
          test -s dist/OpenNES-debug.apk.sha256
          (cd dist && sha256sum -c OpenNES-debug.apk.sha256)

          SHA_SHORT="${GITHUB_SHA:0:12}"
          NOTES="Automated OpenNES **debug/test build** from master.

          Source commit: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}

          This release contains an installable APK only; it is not signed with the OpenNES production release key. Android package ID: \`com.jpluker.opennes.debug\`.

          Existing installations from this same debug-signing identity can be updated in place. Official release signing is deferred. The latest successful build replaces the APK on this page."

          if gh release view dev-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload dev-latest dist/OpenNES-debug.apk dist/OpenNES-debug.apk.sha256 --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit dev-latest \
              --title "OpenNES Development APK" \
              --notes "$NOTES" \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create dev-latest dist/OpenNES-debug.apk dist/OpenNES-debug.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "OpenNES Development APK" \
              --notes "$NOTES" \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          fi

          echo "### OpenNES APK published" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$SHA_SHORT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/dev-latest/OpenNES-debug.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: https://github.com/$GITHUB_REPOSITORY/releases/download/dev-latest/OpenNES-debug.apk.sha256" >> "$GITHUB_STEP_SUMMARY"
