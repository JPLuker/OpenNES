name: OpenNES Android CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build and lint Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source and emulator cores
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Assemble open-source bundled debug APK
        run: |
          chmod +x gradlew
          ./gradlew :lemuroid-app:assembleFreeBundleDebug --stacktrace

      - name: Stage OpenNES APK
        run: |
          mkdir -p dist
          APK="$(find lemuroid-app/build/outputs/apk/freeBundle/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" dist/OpenNES-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenNES-debug-apk
          path: dist/OpenNES-debug.apk
          if-no-files-found: error

      - name: Run Kotlin style checks
        run: ./gradlew ktlintCheck --stacktrace
