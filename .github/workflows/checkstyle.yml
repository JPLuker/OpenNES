name: OpenNES Android CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build OpenNES debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source and emulator cores
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Remove non-NES metadata from release artifact
        run: |
          python3 scripts/trim-libretro-db.py --in-place lemuroid-metadata-libretro-db/src/main/assets/libretro-db.sqlite

      - name: Assemble open-source bundled debug APK
        run: |
          chmod +x gradlew
          ./gradlew :lemuroid-app:assembleFreeBundleDebug --stacktrace

      - name: Stage and inspect OpenNES APK
        run: |
          mkdir -p dist
          APK="$(find lemuroid-app/build/outputs/apk/freeBundle/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" dist/OpenNES-debug.apk
          python3 scripts/inspect-apk.py --nes-only dist/OpenNES-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenNES-debug-apk
          path: dist/OpenNES-debug.apk
          if-no-files-found: error

  lint:
    name: Kotlin lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out source and emulator cores
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check Kotlin source formatting
        run: |
          chmod +x gradlew
          ./gradlew ktlintCheck --stacktrace

      - name: Upload lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OpenNES-ktlint-reports
          path: |
            **/build/reports/ktlint/**/*.txt
            **/build/reports/ktlint/**/*.html
          if-no-files-found: warn
