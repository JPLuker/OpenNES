<!DOCTYPE html>
<!-- Based on https://material-components-web.appspot.com/card.html -->
<html class="mdc-typography">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Open-Source Licenses</title>
        <meta http-equiv="Content-Security-Policy"
              content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'">
        <style>
            body {
                background: #f2f2f2;
                color: #20232a;
                font: 15px/1.5 system-ui, sans-serif;
                margin: 0;
            }
            header {
                background: #25272d;
                color: white;
                font-size: 20px;
                font-weight: 700;
                padding: 16px 20px;
                position: sticky;
                top: 0;
            }
            main { padding: 16px; }
            #demo-wrapper { margin: 0 auto; max-width: 880px; }
            .demo-card {
                background: white;
                border: 1px solid #d4d6db;
                border-radius: 12px;
                margin-bottom: 16px;
                padding: 18px;
            }
            .demo-card h2 { font-size: 18px; margin: 0 0 4px; }
            .demo-card a { color: #9b293d; overflow-wrap: anywhere; }
            .license-copyright { color: #555861; margin: 6px 0 12px; }
            .license-text {
                font-family: monospace;
                font-size: 12px;
                overflow-wrap: anywhere;
                white-space: pre-wrap;
            }
        </style>
        <script type="application/javascript">

                    distributed under the License is distributed on an "AS IS" BASIS,
                    WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
                    See the License for the specific language governing permissions and
                    limitations under the License.`,
                  "mit": `
                    Permission is hereby granted, free of charge, to any person obtaining a copy
                    of this software and associated documentation files (the "Software"), to deal
                    in the Software without restriction, including without limitation the rights
                    to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
                    copies of the Software, and to permit persons to whom the Software is
                    furnished to do so, subject to the following conditions:

                    The above copyright notice and this permission notice shall be included in all
                    copies or substantial portions of the Software.

                    THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
                    IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
                    FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
                    AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
                    LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
                    OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
                    SOFTWARE.`
            };

            var LIBRARIES = [
              {
                  "name": "AutoDispose",
                  "url": "https://github.com/uber/AutoDispose",
                  "copyright": "Copyright (C) 2017 Uber Technologies",
                  "license": "apache2"
              },
              {
                  "name": "Dagger",
                  "url": "https://google.github.io/dagger",
                  "copyright": "Copyright 2012 The Dagger Authors",
                  "license": "apache2"
              },
              {
                  "name": "Google API Client",
                  "url": "https://github.com/google/google-api-java-client",
                  "license": "apache2"
              },
              {
                  "name": "Java Native Access",
                  "url": "https://github.com/java-native-access/jna",
                  "license": "apache2"
              },
              {
                  "name": "Koptional",
                  "url": "https://github.com/gojuno/koptional",
                  "copyright": "Copyright 2017 Juno, Inc.",
                  "license": "apache2"
              },
              {
                  "name": "Kotlin",
                  "url": "https://kotlinlang.org",
                  "copyright": "Copyright 2010-2017 JetBrains s.r.o.",
                  "license": "apache2"
              },
              {
                  "name": "LibRetro",
                  "url": "https://www.libretro.com/index.php/api",
                  "copyright": "Copyright (C) 2010-2017 The RetroArch team",
                  "license": "mit"
              },
              {
                  "name": "ZXing Android Embedded",
                  "url": "https://github.com/journeyapps/zxing-android-embedded",
                  "copyright": "Copyright (C) 2012-2022 ZXing authors, Journey Mobile",
                  "license": "apache2"
              },
              {
                  "name": "ZXing Core",
                  "url": "https://github.com/zxing/zxing",
                  "copyright": "Copyright (C) 2007 ZXing authors",
                  "license": "apache2"
              },
              {
                  "name": "OkHttp",
                  "url": "https://github.com/square/okhttp",
                  "license": "apache2",
              },
              {
                  "name": "Picasso",
                  "url": "https://github.com/square/picasso",
                  "copyright": "Copyright 2013 Square, Inc.",
                  "license": "apache2"
              },
              {
                  "name": "Retrofit",

              },

                  "copyright": "Copyright (C) 2015 Thomas Bruyelle",

              {

              }

            // https://github.com/thejameskyle/min-indent/blob/master/index.js
            function minIndent(str) {
              const match = str.match(/^[ \t]*(?=\S)/gm);
              if (!match) {
                return 0;
              }
              return Math.min.apply(Math, match.map(x => x.length));
            }

            // https://github.com/sindresorhus/strip-indent/blob/master/index.js
            function stripIndent(str) {
              const indent = minIndent(str);
              if (indent === 0) {
                return str;
              }
              const re = new RegExp(`^[ \\t]{${indent}}`, 'gm');
              return str.replace(re, '');
            }

            window.addEventListener("DOMContentLoaded", () => {
                const container = document.getElementById("demo-wrapper");
                LIBRARIES.forEach((library) => {
                    const card = document.createElement("article");
                    card.className = "demo-card";
                    const heading = document.createElement("h2");
                    const link = document.createElement("a");
                    link.textContent = library.name;
                    if (library.url && library.url.startsWith("https://")) {
                        link.href = library.url;
                        link.rel = "noopener noreferrer";
                        heading.appendChild(link);
                    } else {
                        heading.textContent = library.name;
                    }
                    card.appendChild(heading);
                    if (library.copyright) {
                        const copyright = document.createElement("p");
                        copyright.className = "license-copyright";
                        copyright.textContent = library.copyright;
                        card.appendChild(copyright);
                    }
                    const license = document.createElement("pre");
                    license.className = "license-text";
                    license.textContent = stripIndent(LICENSES[library.license] || "");
                    card.appendChild(license);
                    container.appendChild(card);
                });
            });
        </script>
    </head>
    <body>
        <header>Open-Source Licenses</header>
        <main id="libraries">
            <section id="demo-wrapper"></section>
        </main>
    </body>
</html>
